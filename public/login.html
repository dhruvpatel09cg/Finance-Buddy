<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
  --bg-1:#1c1147;
  --bg-2:#2e1f8f;
  --bg-3:#4b2fd6;
  --card-border:#4f6bff;
  --panel:#241a5e;
  --input-bg:#ffffff;
  --input-text:#1a1a2e;
  --muted:#b8b0e0;
  --accent-green:#1f9d55;
  --accent-green-dark:#187f44;
  --logo-shield:#7c5cff;
  --white:#ffffff;
  --danger-link:#8fe3a8;
}

*{ box-sizing:border-box; }

html,body{
  margin:0;
  padding:0;
  min-height:100vh;
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 0%, var(--bg-3) 0%, var(--bg-2) 45%, var(--bg-1) 100%);
  color:var(--white);
}

.page{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
}

/* Logo */
.logo{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:28px;
}

.logo-icon{
  width:44px;
  height:44px;
  border-radius:12px;
  background:linear-gradient(135deg,#7c5cff,#5a3fd6);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 6px 18px rgba(124,92,255,0.45);
  flex-shrink:0;
}

.logo-icon svg{ width:22px; height:22px; }

.logo-text{
  font-size:26px;
  font-weight:600;
  letter-spacing:0.2px;
}
.logo-text .light{ color:rgba(255,255,255,0.55); font-weight:500; }
.logo-text .buddy{ color:#3fd67c; font-weight:700; }

/* Card */
.card{
  width:100%;
  max-width:380px;
  background:linear-gradient(180deg, rgba(90,63,214,0.55), rgba(36,26,94,0.85));
  border:1px solid rgba(90,111,255,0.55);
  border-radius:18px;
  padding:28px 26px 30px;
  box-shadow:
    0 0 0 1px rgba(90,111,255,0.15),
    0 20px 60px rgba(20,10,60,0.55),
    0 0 40px rgba(79,107,255,0.25);
}

.card h1{
  margin:0 0 6px;
  font-size:22px;
  font-weight:700;
}

.card .subtitle{
  margin:0 0 20px;
  font-size:13px;
  line-height:1.4;
  color:var(--muted);
}

/* Tabs */
.tabs{
  display:flex;
  background:rgba(15,10,45,0.4);
  border:1px solid rgba(90,111,255,0.35);
  border-radius:10px;
  padding:4px;
  margin-bottom:20px;
}

.tab{
  flex:1;
  text-align:center;
  padding:9px 0;
  border-radius:8px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  border:none;
  background:transparent;
  color:var(--muted);
  transition:background .18s ease, color .18s ease;
}

.tab.active{
  background:var(--white);
  color:#3d2fb0;
}

.tab:focus-visible, .field input:focus-visible, .btn-primary:focus-visible{
  outline:2px solid #7fd8ff;
  outline-offset:2px;
}

/* Fields */
.field{
  margin-bottom:16px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:600;
  margin-bottom:6px;
  color:#d8d3ff;
}

.field-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.forgot-link{
  font-size:12px;
  color:var(--danger-link);
  text-decoration:none;
  font-weight:600;
}
.forgot-link:hover{ text-decoration:underline; }

.input-wrap{
  position:relative;
  display:flex;
  align-items:center;
}

.input-wrap svg.icon-left{
  position:absolute;
  left:12px;
  width:16px;
  height:16px;
  color:#8b86b5;
  pointer-events:none;
}

.input-wrap input{
  width:100%;
  padding:12px 12px 12px 38px;
  border-radius:10px;
  border:none;
  background:var(--input-bg);
  color:var(--input-text);
  font-size:14px;
  font-family:inherit;
}

.input-wrap input::placeholder{ color:#8b86b5; }

.input-wrap .toggle-visibility{
  position:absolute;
  right:12px;
  background:none;
  border:none;
  cursor:pointer;
  color:#8b86b5;
  display:flex;
  padding:0;
}
.input-wrap .toggle-visibility svg{ width:17px; height:17px; }

/* Button */
.btn-primary{
  width:100%;
  padding:13px 0;
  margin-top:6px;
  border:none;
  border-radius:10px;
  background:linear-gradient(180deg,var(--accent-green),var(--accent-green-dark));
  color:var(--white);
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(31,157,85,0.35);
  transition:transform .12s ease, box-shadow .12s ease;
}

.btn-primary:hover{
  transform:translateY(-1px);
  box-shadow:0 10px 26px rgba(31,157,85,0.45);
}
.btn-primary:active{ transform:translateY(0); }

.signup{
  text-align:center;
  margin-top:18px;
  font-size:13px;
  color:var(--muted);
}
.signup a{
  color:var(--danger-link);
  font-weight:700;
  text-decoration:none;
}
.signup a:hover{ text-decoration:underline; }

/* Responsive */
@media (max-width:420px){
  .card{ padding:22px 18px 26px; border-radius:16px; }
  .logo-text{ font-size:22px; }
  .logo-icon{ width:38px; height:38px; }
}

@media (max-width:340px){
  .tab{ font-size:12px; padding:8px 0; }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce){
  .btn-primary{ transition:none; }
}

    </style>
</head>
<body>
      <div class="page">

    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L4 5v6c0 5 3.4 9.2 8 10 4.6-.8 8-5 8-10V5l-8-3z" fill="#c9bfff"/>
          <path d="M9 12.2l2 2 4-4.4" stroke="#241a5e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="logo-text"><span class="light">Finance</span><span class="buddy">Buddy</span></div>
    </div>

    <form class="card" id="loginForm" novalidate>
      <h1>Welcome back</h1>
      <p class="subtitle">Securely split your salary and access emergency reserves.</p>

      <div class="tabs" role="tablist" aria-label="Account type">
        <button type="button" class="tab active" id="tabEmployee" role="tab" aria-selected="true">Parent</button>
        <button type="button" class="tab" id="tabManager" role="tab" aria-selected="false">Child</button>
      </div>

      <div class="field">
        <label for="email">Registered mail ID</label>
        <div class="input-wrap">
          <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M3 7l9 6 9-6"/>
          </svg>
          <input type="email" id="email" name="email" placeholder="aravind.sharma@corporatelabs.in" autocomplete="email" required>
        </div>
      </div>

      <div class="field">
        <div class="field-row">
          <label for="password" style="margin-bottom:0;">Password</label>
          <a href="#" class="forgot-link">Forgot?</a>
        </div>
        <div class="input-wrap" style="margin-top:6px;">
          <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="10" width="16" height="10" rx="2"/>
            <path d="M8 10V7a4 4 0 018 0v3"/>
          </svg>
          <input type="password" id="password" name="password" placeholder="••••••••••••" autocomplete="current-password" required>
          <button type="button" class="toggle-visibility" id="togglePw" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

     

      <button type="submit" class="btn-primary">Sign In</button>

      <p class="signup">Don't have an account? <a href="#">Request Access</a></p>
    </form>
  </div>

<script>
  // Tab toggle (Employee / Manager)
  const tabEmployee = document.getElementById('tabEmployee');
  const tabManager = document.getElementById('tabManager');
  [tabEmployee, tabManager].forEach(tab=>{
    tab.addEventListener('click', ()=>{
      [tabEmployee, tabManager].forEach(t=>{
        t.classList.remove('active');
        t.setAttribute('aria-selected','false');
      });
      tab.classList.add('active');
      tab.setAttribute('aria-selected','true');
    });
  });

  // Password show/hide
  const pwInput = document.getElementById('password');
  const toggleBtn = document.getElementById('togglePw');
  toggleBtn.addEventListener('click', ()=>{
    const isHidden = pwInput.type === 'password';
    pwInput.type = isHidden ? 'text' : 'password';
    toggleBtn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
  });

  // Prototype submit handler (no backend wired up yet)
  document.getElementById('loginForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    alert('Prototype only — connect this form to your auth backend.');
  });
</script>
</body>
</html>
